<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambiar contraseña — ACACES</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem 1.8rem; box-shadow: var(--shadow); }
  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.4rem; }
  .field input { width: 100%; padding: 0.65rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--bg); color: var(--ink); }
  .msg { font-size: 0.85rem; padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 1rem; display: none; }
  .msg.error { background: var(--bad-bg); color: var(--bad); }
  .msg.good { background: var(--good-bg); color: var(--good); }
  .btn-full { width: 100%; justify-content: center; }
</style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <p class="lesson-kicker">Primer ingreso</p>
      <h1 style="font-size:1.3rem; margin-bottom:0.4rem;">Cambia tu contraseña temporal</h1>
      <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1.4rem;">Por seguridad, debes elegir una contraseña propia antes de continuar (mínimo 8 caracteres).</p>

      <p class="msg error" id="error"></p>
      <p class="msg good" id="ok">Contraseña actualizada. Redirigiendo…</p>

      <form id="form">
        <div class="field">
          <label for="nueva">Nueva contraseña</label>
          <input id="nueva" type="password" minlength="8" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirmar">Confirmar contraseña</label>
          <input id="confirmar" type="password" minlength="8" required autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-full" type="submit">Guardar y continuar</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const errorEl = document.getElementById('error');
    const okEl = document.getElementById('ok');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const nueva = document.getElementById('nueva').value;
      const confirmar = document.getElementById('confirmar').value;
      if (nueva !== confirmar) {
        errorEl.textContent = 'Las contraseñas no coinciden.';
        errorEl.style.display = 'block';
        return;
      }
      const res = await fetch('/api/cambiar-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nueva }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || 'No se pudo actualizar la contraseña.';
        errorEl.style.display = 'block';
        return;
      }
      okEl.style.display = 'block';
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    });
  </script>
</body>
</html>
