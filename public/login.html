<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Capacitación ACACES</title>
<link rel="stylesheet" href="css/design-system.css">
<style>
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem 1.8rem; box-shadow: var(--shadow); }
  .login-brand { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.6rem; }
  .login-brand .mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent-brand), var(--laft)); }
  .login-brand span { font-family: var(--font-display); font-size: 1.15rem; }
  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.4rem; }
  .field input { width: 100%; padding: 0.65rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--bg); color: var(--ink); }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .login-error { background: var(--bad-bg); color: var(--bad); font-size: 0.85rem; padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 1rem; display: none; }
  .login-btn { width: 100%; justify-content: center; margin-top: 0.4rem; }
  .login-foot { margin-top: 1.6rem; font-size: 0.8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand"><span class="mark"></span><span>ACACES · Capacitación</span></div>
      <h1 style="font-size:1.3rem; margin-bottom:0.3rem;">Capacitación anual 2026</h1>
      <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1.4rem;">Ingresa con el usuario y la contraseña que te compartió el Área de Riesgos.</p>

      <p class="login-error" id="error"></p>

      <form id="login-form">
        <div class="field">
          <label for="usuario">Usuario o correo</label>
          <input id="usuario" name="usuario" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary login-btn" type="submit">Ingresar</button>
      </form>

      <p class="login-foot">¿No tienes credenciales? Contacta al Área de Riesgos o a Cumplimiento.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'No se pudo iniciar sesión.';
          errorEl.style.display = 'block';
          return;
        }
        if (data.debeCambiarPassword) {
          window.location.href = 'cambiar-password.html';
        } else if (data.rol === 'administrador') {
          window.location.href = 'admin/index.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        errorEl.textContent = 'No se pudo conectar con el servidor.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
